<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小乐乐</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #fff9e6 0%, #e6f7ff 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 20px; color: #343a40;
  }
  .wrap { width: 100%; max-width: 460px; }
  .card {
    background: #fff; border-radius: 24px; box-shadow: 0 16px 40px rgba(0,0,0,0.10);
    padding: 28px; text-align: center;
  }
  h1 { font-size: 28px; margin-bottom: 8px; }
  .sub { color: #868e96; margin-bottom: 22px; font-size: 14px; }
  button {
    cursor: pointer; border: none; border-radius: 14px; font-size: 16px;
    padding: 12px 22px; font-weight: 600; transition: .15s;
  }
  .btn-primary { background: #ffd43b; color: #343a40; }
  .btn-primary:hover { background: #fab005; }
  .btn-ghost { background: #f1f3f5; color: #495057; }
  .btn-ghost:hover { background: #e9ecef; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .score { font-size: 18px; font-weight: 700; }
  .topbar .right { display: flex; gap: 8px; }
  .topbar button { font-size: 13px; padding: 8px 12px; }
  #board { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .tile {
    aspect-ratio: 1/1; background: #fff7e6; border: 2px solid #ffe8a3; border-radius: 14px;
    font-size: 30px; line-height: 1; display: grid; place-items: center;
    cursor: pointer; user-select: none; transition: .12s;
  }
  .tile span { display: inline-block; line-height: 1; }
  .tile:hover { transform: translateY(-2px); }
  .tile.sel { background: #fff3bf; border-color: #fcc419; transform: scale(1.06); box-shadow: 0 6px 14px rgba(252,196,25,.4); }
  .tile.gone { visibility: hidden; }
  .hint { margin-top: 14px; min-height: 20px; color: #e8590c; font-size: 14px; font-weight: 600; }
  .hidden { display: none !important; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; }
  .overlay .card { max-width: 320px; }
</style>
</head>
<body>
<div class="wrap">
  <div id="home" class="card">
    <h1>🍓 小乐乐 🍎</h1>
    <p class="sub">点中三个相同的水果就能消除得分！</p>
    <button class="btn-primary" onclick="startGame()">开始游戏</button>
  </div>

  <div id="game" class="card hidden">
    <div class="topbar">
      <div class="score">得分：<span id="score">0</span></div>
      <div class="right">
        <button class="btn-ghost" id="musicBtn" onclick="toggleMusic()">🔊 音乐</button>
        <button class="btn-ghost" onclick="exitGame()">退出</button>
      </div>
    </div>
    <div id="board"></div>
    <div class="hint" id="hint"></div>
  </div>
</div>

<div id="win" class="overlay hidden">
  <div class="card">
    <h1>🎉 通关啦！</h1>
    <p class="sub">最终得分：<span id="finalScore">0</span></p>
    <div style="display:flex; gap:10px; justify-content:center;">
      <button class="btn-primary" onclick="startGame()">再玩一次</button>
      <button class="btn-ghost" onclick="backToMenu()">返回菜单</button>
    </div>
  </div>
</div>

<script>
const FRUITS = ['🍎','🍌','🍇','🍊','🍓','🍉','🥝','🍑','🍒','🍐'];
const COLS = 6, ROWS = 5;
let tiles = [], selected = [], score = 0, locked = false;

function shuffle(a){
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildTiles(){
  const arr = [];
  FRUITS.forEach(f => { arr.push(f, f, f); }); // 每种 3 块 = 30 块
  return shuffle(arr);
}

function startGame(){
  document.getElementById('home').classList.add('hidden');
  document.getElementById('win').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  score = 0; selected = []; locked = false;
  document.getElementById('score').textContent = '0';
  document.getElementById('hint').textContent = '';
  tiles = buildTiles();
  render();
  startMusic();
}

function render(){
  const board = document.getElementById('board');
  board.innerHTML = '';
  tiles.forEach((f, idx) => {
    const d = document.createElement('div');
    d.className = 'tile' + (f === null ? ' gone' : '') + (selected.some(s => s.idx === idx) ? ' sel' : '');
    const s = document.createElement('span');
    s.textContent = f || '';
    d.appendChild(s);
    if (f !== null) d.onclick = () => pick(idx);
    board.appendChild(d);
  });
}

function pick(idx){
  if (locked) return;
  if (tiles[idx] === null) return;
  if (selected.some(s => s.idx === idx)) return;
  selected.push({ idx, emoji: tiles[idx] });
  playClick();
  render();
  if (selected.length < 3) return;
  const same = selected[0].emoji === selected[1].emoji && selected[1].emoji === selected[2].emoji;
  if (same){
    selected.forEach(s => tiles[s.idx] = null);
    score += 10;
    playMatch();
    document.getElementById('score').textContent = score;
    document.getElementById('hint').textContent = '消除成功！+10 🎉';
    selected = [];
    render();
    if (tiles.every(t => t === null)) win();
  } else {
    locked = true;
    document.getElementById('hint').textContent = '三个要相同哦，再试试～';
    setTimeout(() => { selected = []; locked = false; render(); }, 600);
  }
}

function win(){
  stopMusic();
  document.getElementById('finalScore').textContent = score;
  document.getElementById('win').classList.remove('hidden');
}

function exitGame(){
  stopMusic();
  document.getElementById('game').classList.add('hidden');
  document.getElementById('home').classList.remove('hidden');
}
function backToMenu(){
  stopMusic();
  document.getElementById('win').classList.add('hidden');
  document.getElementById('game').classList.add('hidden');
  document.getElementById('home').classList.remove('hidden');
}

// ---- 欢快音乐：Web Audio 合成，无需外部文件 ----
let audioCtx = null, musicTimer = null, playing = false;
function startMusic(){
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch(e){ return; }
  if (playing) return;
  playing = true;
  const notes = [523.25, 587.33, 659.25, 783.99, 659.25, 587.33, 523.25, 659.25];
  let i = 0;
  function note(){
    if (!playing) return;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'triangle'; o.frequency.value = notes[i % notes.length];
    const t = audioCtx.currentTime;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.12, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + 0.26);
    i++;
  }
  note();
  musicTimer = setInterval(note, 300);
}
function stopMusic(){ playing = false; if (musicTimer) clearInterval(musicTimer); }
function toggleMusic(){
  if (playing){ stopMusic(); document.getElementById('musicBtn').textContent = '🔇 音乐'; }
  else { startMusic(); document.getElementById('musicBtn').textContent = '🔊 音乐'; }
}
function playClick(){
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch(e){ return; }
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.value = 880;
  const t = audioCtx.currentTime;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.25, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + 0.13);
}
function playMatch(){
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch(e){ return; }
  const notes = [659.25, 783.99, 1046.50]; // E5 → G5 → C6 上行欢快音
  notes.forEach((freq, i) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'triangle';
    o.frequency.value = freq;
    const t = audioCtx.currentTime + i * 0.08;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.25, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + 0.2);
  });
}
</script>
</body>
</html>
